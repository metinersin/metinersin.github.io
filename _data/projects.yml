- name: Student Distribution Tool
  summary: >
    A browser-based tool for sorting student lists with Turkish alphabetical
    order, distributing students across configured classrooms, and exporting a
    single Excel workbook with classroom-specific worksheets.
  stack:
    - JavaScript
    - HTML
    - CSS
    - Jekyll
    - SheetJS
  links:
    - label: Live tool
      url: /student-distribution-tool/
    - label: GitHub
      url: https://github.com/metinersin/metinersin.github.io
  notes: Runs entirely in the browser and exports classroom lists as Excel worksheets.
