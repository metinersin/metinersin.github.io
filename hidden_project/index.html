<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Hidden Project</title>
  <style>
    :root {
      --bg: #f5f2ea;
      --bg-accent: #ece6da;
      --panel: rgba(255, 255, 255, 0.72);
      --text: #161616;
      --muted: #6a665f;
      --line: rgba(22, 22, 22, 0.12);
      --shadow: 0 24px 80px rgba(22, 22, 22, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      padding: 32px;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(255, 255, 255, 0.8), transparent 38%),
        linear-gradient(135deg, var(--bg) 0%, var(--bg-accent) 100%);
      font-family: "Iowan Old Style", "Palatino Linotype", "URW Palladio L", serif;
      display: grid;
      place-items: center;
    }

    .frame {
      width: min(100%, 760px);
      padding: clamp(28px, 4vw, 56px);
      border: 1px solid var(--line);
      background: var(--panel);
      backdrop-filter: blur(18px);
      box-shadow: var(--shadow);
    }

    .eyebrow {
      margin: 0 0 24px;
      color: var(--muted);
      font-family: "Optima", "Avenir Next", "Candara", sans-serif;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.28em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.8rem, 8vw, 5.8rem);
      font-weight: 400;
      letter-spacing: -0.06em;
      line-height: 0.94;
    }

    .summary {
      max-width: 34rem;
      margin: 24px 0 0;
      color: var(--muted);
      font-size: clamp(1.05rem, 2vw, 1.2rem);
      line-height: 1.75;
    }

    .divider {
      width: 72px;
      height: 1px;
      margin: 36px 0 28px;
      background: var(--line);
    }

    .details {
      display: grid;
      gap: 14px;
      color: var(--text);
      font-family: "Optima", "Avenir Next", "Candara", sans-serif;
      font-size: 0.95rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .details span {
      color: var(--muted);
      margin-right: 12px;
    }

    @media (max-width: 640px) {
      body {
        padding: 18px;
      }

      .frame {
        padding: 24px;
      }

      .summary {
        line-height: 1.6;
      }
    }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Private Preview</p>
    <h1>Hidden Project</h1>
    <p class="summary">
      A quiet space for an in-progress idea. This page is intentionally minimal,
      detached from the main site, and reachable only by its direct URL.
    </p>
    <div class="divider" aria-hidden="true"></div>
    <section class="details" aria-label="Project status">
      <div><span>Status</span>Early demo</div>
      <div><span>Visibility</span>Unlisted</div>
      <div><span>Mode</span>Work in progress</div>
    </section>
  </main>
</body>
</html>
